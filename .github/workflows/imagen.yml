name: imagen

# vidalstore-backend tiene dos servicios, cada uno con su Dockerfile: gateway y microservicio.
# Un solo workflow construye las dos imagenes (una por pieza) cuando main cambia.
# La etiqueta es el sha del commit de main: ghcr.io/<usuario>/vidalstore-<pieza>:<sha>
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Cada pieza (gateway, microservicio) se prueba por separado. La imagen solo se publica si las pruebas pasan.
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pieza: [gateway, microservicio]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.pieza }}/package-lock.json
      - run: npm ci
        working-directory: ./${{ matrix.pieza }}
      - run: npm run lint --if-present
        working-directory: ./${{ matrix.pieza }}
      - run: npm test --if-present
        working-directory: ./${{ matrix.pieza }}
      - run: npm run build --if-present
        working-directory: ./${{ matrix.pieza }}
  imagen:
    needs: pruebas
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pieza: [gateway, microservicio]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.pieza }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/vidalstore-${{ matrix.pieza }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
